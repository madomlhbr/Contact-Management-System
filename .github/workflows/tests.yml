name: Python contact-system tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install virtual display / Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Compile modules
        run: |
          python -m py_compile "[BuenoMalhabour]_MSYS30A_FinalProject_Code.py" "[BuenoMalhabour]_MSYS30A_FinalProject_contact gui.py" "[BuenoMalhabour]_MSYS30A_FinalProject_test_gui.py"
      - name: Core unit tests
        run: python "[BuenoMalhabour]_MSYS30A_FinalProject_Code.py" --self-test
      - name: GUI smoke tests
        run: xvfb-run -a python "[BuenoMalhabour]_MSYS30A_FinalProject_test_gui.py"
      - name: Console demo smoke test
        run: python "[BuenoMalhabour]_MSYS30A_FinalProject_Code.py" --demo
